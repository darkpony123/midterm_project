services:
  db:
    image: postgres:16
    container_name: library_db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - library_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    container_name: library_api
    env_file: .env
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_net

volumes:
  pgdata:

networks:
  library_net:
